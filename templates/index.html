<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Voice Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <div class="header">
    <div class="logo">◈</div>
    <div class="header-text">
      <h1>AI Voice Agent</h1>
      <p>Powered by GPT-4o · Whisper · TTS</p>
    </div>
    <button class="reset-btn" onclick="resetChat()" title="Clear conversation">↺ Reset</button>
  </div>

  <div class="chat" id="chat">
    <div class="welcome">
      <div class="welcome-icon">🎙</div>
      <p>Press and hold the mic button to speak.<br/>Release to get an answer.</p>
    </div>
  </div>

  <div class="bottom">
    <div class="status-bar">
      <div class="indicator" id="indicator"></div>
      <span id="status-text">Ready</span>
    </div>

    <button
      class="mic"
      id="mic"
      onmousedown="startRecording()"
      onmouseup="stopRecording()"
      ontouchstart="startRecording()"
      ontouchend="stopRecording()"
    >
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/>
        <path d="M5 10a7 7 0 0014 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <p class="hint">Hold to speak — release to send</p>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
